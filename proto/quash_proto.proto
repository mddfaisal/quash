syntax = "proto3";

package quash_proto;

option go_package = "github.com/mddfaisal/quash/proto";

message SetKVRequest {
    string key = 1;
    string value = 2;
    int64 time_out_duration = 3;
    int64 init_time = 4;
}

message SetKVResponse {
    string response = 1;
}

message GetKVRequest {
    string key = 1;
}

message GetKVResponse {
    string value = 1;
}

message DeleteKVRequest {
    string key = 1;
}

message DeleteKVResponse {
    string value = 1;
}

message PushIntoQueueRequest {
    string queue_name = 1;
    string value = 2;
}

message PushIntoQueueResponse {
    string response = 1; 
}

message PopFromQueueRequest {
    string queue_name = 1;
}

message PopFromQueueResponse {
    string response = 1;
}

message QueueListResponse {
    repeated string queueList = 1;
}

message QueueMetricResponse {
    map<string, int64> queue_matric = 1;
}

message QueryQueueListRequest{}

message QueryQueueMetricRequest{}

message CreateQueueRequest{
    string queue_name = 1;
}

message CreateQueueResponse{
    string response = 1;
}

message DeleteQueueRequest{
    string queue_name = 1;
}

message DeleteQueueResponse{
    string response = 1;
}

service QuashService {
    rpc SetKV (SetKVRequest) returns (SetKVResponse);
    rpc GetKV (GetKVRequest) returns (GetKVResponse);
    rpc DeleteKV (DeleteKVRequest) returns (DeleteKVResponse);
    rpc CreateQueue(CreateQueueRequest) returns (CreateQueueResponse);
    rpc DeleteQueue(DeleteQueueRequest) returns (DeleteQueueResponse);
    rpc PushQueue (PushIntoQueueRequest) returns (PushIntoQueueResponse);
    rpc PopQueue (PopFromQueueRequest) returns (stream PopFromQueueResponse);
    rpc QueryQueueList(QueryQueueListRequest) returns (QueueListResponse);
    rpc QueryQueueMetric(QueryQueueMetricRequest) returns (stream QueueMetricResponse);
}